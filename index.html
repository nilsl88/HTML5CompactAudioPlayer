<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Compact Audio Player</title>
  <link rel="stylesheet" href="./player.css?v=9">
</head>
<body class="is-loading">
  <a class="skip-link" href="#player">Skip to player</a>
  <div id="statusAnnouncer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <main class="page">
    <header class="page-header">
      <h1 id="bookTitle" class="book-title">Audio</h1>
      <p id="bookMeta" class="book-meta">Loading…</p>
    </header>

    <section id="player" class="player-card is-loading" aria-labelledby="bookTitle" aria-busy="true">
      <div class="skeleton" aria-hidden="true">
        <span class="skeleton-play"></span>
        <span class="skeleton-progress"></span>
        <span class="skeleton-controls"></span>
      </div>

      <div class="player-bar">
        <button id="playPauseBtn" class="play-button" type="button" aria-label="Play" disabled>
          <span id="playPauseIcon" aria-hidden="true">▶</span>
        </button>
        <div class="progress-block">
          <label id="seekLabel" class="sr-only" for="seek">Seek</label>
          <input id="seek" class="seek" type="range" min="0" max="1000" value="0" step="1" disabled>
          <div class="time-row" aria-hidden="true">
            <output id="timeCur" class="time" for="seek">0:00</output>
            <output id="timeDur" class="time">—:—</output>
          </div>
        </div>
      </div>

      <button id="coverButton" class="cover-button" type="button" hidden>
        <img id="coverImg" class="cover-image" alt="" decoding="async" fetchpriority="low">
      </button>

      <fieldset class="transport-controls">
        <legend class="sr-only">Playback controls</legend>
        <button id="chaptersBtn" class="icon-button" type="button" aria-expanded="false" aria-controls="chaptersPanel"><span aria-hidden="true">☰</span><span class="sr-only">Chapters</span></button>
        <button id="prevChapterBtn" class="icon-button" type="button" aria-label="Previous chapter" disabled><svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h2v14H4zM19 5v14L7 12z"></path></svg></button>
        <button id="skipBackBtn" class="skip-button" type="button" aria-label="Skip back 15 seconds"><span aria-hidden="true">−15</span></button>
        <button id="skipForwardBtn" class="skip-button" type="button" aria-label="Skip forward 15 seconds"><span aria-hidden="true">+15</span></button>
        <button id="nextChapterBtn" class="icon-button" type="button" aria-label="Next chapter" disabled><svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 5h2v14h-2zM5 5v14l12-7z"></path></svg></button>
        <button id="sleepBtn" class="icon-button" type="button" aria-expanded="false" aria-controls="sleepPanel"><span aria-hidden="true">☾</span><span class="sr-only">Sleep timer</span></button>
        <button id="optionsBtn" class="icon-button" type="button" aria-expanded="false" aria-controls="optionsPanel"><svg class="control-icon control-icon-stroke" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg><span class="sr-only">Options</span></button>
      </fieldset>

      <section id="chaptersPanel" class="popup-panel" aria-labelledby="chaptersTitle" hidden>
        <header class="panel-header"><h2 id="chaptersTitle" class="panel-title">Chapters</h2><button id="closeChaptersBtn" class="icon-button panel-close" type="button" aria-label="Close chapters"><span aria-hidden="true">×</span></button></header>
        <div id="chaptersList" class="panel-list"></div>
      </section>

      <section id="sleepPanel" class="popup-panel" aria-labelledby="sleepTitle" hidden>
        <header class="panel-header"><h2 id="sleepTitle" class="panel-title">Sleep timer</h2><button id="closeSleepBtn" class="icon-button panel-close" type="button" aria-label="Close"><span aria-hidden="true">×</span></button></header>
        <div id="sleepList" class="panel-list"></div>
      </section>

      <form id="optionsPanel" class="options-panel" hidden>
        <h2 id="optionsTitle" class="sr-only">Options</h2>
        <fieldset class="settings-group">
          <legend id="audioSettingsLegend">Audio</legend>
          <div id="bookRow" class="setting-row" hidden><label for="bookSelect">Audiobook</label><select id="bookSelect"></select></div>
          <div class="setting-row"><label for="langSelect">Audio language</label><select id="langSelect"></select></div>
          <div class="setting-row"><label for="qualitySelect">Quality</label><select id="qualitySelect"></select></div>
          <div id="volumeRow" class="setting-row range-row"><label for="volumeRange">Volume</label><div class="range-wrap"><input id="volumeRange" type="range" min="0" max="100" value="100" step="1"><output id="volumeValue" for="volumeRange">100%</output></div></div>
          <div class="setting-row range-row"><label for="speedRange">Playback speed</label><div class="range-wrap"><input id="speedRange" type="range" min="0.5" max="2" value="1" step="0.05"><output id="speedValue" for="speedRange">1×</output></div></div>
          <div class="setting-row"><label for="skipSelect">Skip interval</label><select id="skipSelect"><option value="5">5 s</option><option value="10">10 s</option><option value="15">15 s</option><option value="30">30 s</option><option value="60">60 s</option></select></div>
          <section id="offlineRow" class="offline-setting" aria-labelledby="offlineLabel" hidden>
            <div class="offline-heading">
              <span id="offlineLabel">Offline</span>
              <span id="offlineStatus" class="setting-help"></span>
            </div>
            <progress id="offlineProgress" max="100" value="0" aria-labelledby="offlineLabel offlineStatus" hidden></progress>
            <div class="offline-actions">
              <button id="offlineDownloadBtn" class="secondary-button" type="button">Download for offline use</button>
              <button id="offlineCancelBtn" class="secondary-button" type="button" hidden>Cancel download</button>
              <button id="offlineRemoveBtn" class="secondary-button" type="button" hidden>Remove download</button>
            </div>
          </section>
        </fieldset>
        <fieldset class="settings-group">
          <legend id="appearanceLegend">Appearance</legend>
          <div class="setting-row"><label for="themeSelect">Mode</label><select id="themeSelect"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
          <div class="setting-row"><label for="fontSizeSelect">Text size</label><select id="fontSizeSelect"><option value="s">Small</option><option value="m">Medium</option><option value="l">Large</option></select></div>
          <div class="setting-row"><label for="uiLangSelect">Player language</label><select id="uiLangSelect"></select></div>
        </fieldset>
        <div class="reset-row"><button id="resetBtn" class="text-button" type="button">Reset player</button></div>
      </form>

      <div id="toastHost" class="toast-host" aria-hidden="true"></div>
      <audio id="audio" preload="none" crossorigin="anonymous"></audio>
    </section>
  </main>

  <dialog id="coverDialog" class="cover-dialog" aria-labelledby="coverDialogTitle">
    <h2 id="coverDialogTitle" class="sr-only">Cover image</h2>
    <button id="closeCoverBtn" class="dialog-close icon-button" type="button" aria-label="Close"><span aria-hidden="true">×</span></button>
    <img id="coverDialogImg" class="cover-dialog-image" alt="" decoding="async">
  </dialog>

  <dialog id="onboardingDialog" class="modal" aria-labelledby="onboardingTitle" aria-describedby="onboardingBody">
    <header class="modal-header"><h2 id="onboardingTitle">How this player works</h2><button id="onboardingCloseX" class="icon-button" type="button" aria-label="Close"><span aria-hidden="true">×</span></button></header>
    <div id="onboardingBody" class="modal-body"></div>
    <footer class="modal-footer"><button id="onboardingOk" class="primary-button" type="button">Got it</button></footer>
  </dialog>

  <dialog id="resetDialog" class="modal" aria-labelledby="resetTitle" aria-describedby="resetBody">
    <header class="modal-header"><h2 id="resetTitle">Reset player</h2><button id="resetCloseX" class="icon-button" type="button" aria-label="Close"><span aria-hidden="true">×</span></button></header>
    <div id="resetBody" class="modal-body"></div>
    <footer class="modal-footer split"><button id="resetCancel" class="secondary-button" type="button">Cancel</button><button id="resetOk" class="primary-button" type="button">Reset</button></footer>
  </dialog>

  <script type="module" src="./player.js?v=9"></script>
</body>
</html>
